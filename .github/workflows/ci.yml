name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 and 3.11 bracket the Pythons shipped with ArcGIS Pro 3.x
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (src, tests, toolbox, gp_service)
        run: ruff check .
      - name: Test (includes AST checks of the .pyt — no arcpy needed)
        run: pytest
