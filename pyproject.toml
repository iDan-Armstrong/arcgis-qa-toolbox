[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qacore"
version = "0.2.0"
description = "arcpy-free QA rule engine powering an ArcGIS Pro Python Toolbox and a geoprocessing service"
readme = "README.md"
requires-python = ">=3.9"  # matches the Python shipped with ArcGIS Pro 3.x
license = { text = "MIT" }
authors = [{ name = "Daniel Armstrong" }]
dependencies = []  # intentionally none: must import inside the Pro conda env untouched

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "toolbox", "gp_service"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# .pyt files follow Esri's required class layout; arcpy only exists in Pro/Server.
"toolbox/*.pyt" = ["F821"]
